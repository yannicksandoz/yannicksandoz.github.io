# Déploiement GitHub Pages : blog Jekyll (racine) + galerie 3D (/galerie/).
#
# Se déclenche à chaque push sur master (et sur la branche de développement de
# la galerie), ou manuellement depuis l'onglet Actions (« Run workflow »).
#
# Prérequis (une seule fois) : Settings → Pages → Source = « GitHub Actions ».
# L'étape configure-pages tente de l'activer automatiquement.
name: Deploy Pages (blog + galerie)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PRÉREQUIS : Settings → Pages → Source doit rester sur « GitHub Actions ».
      # Sur une source « branche », GitHub lance en parallèle son propre build
      # Jekyll (« pages build and deployment ») qui ne contient PAS la galerie
      # (exclue dans _config.yml) et qui écrase ce déploiement — d'où un 404 sur
      # /galerie/ alors que le blog s'affiche. Ce réglage ne peut pas être forcé
      # depuis le workflow : GITHUB_TOKEN n'a pas les droits d'administration.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build du blog Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: galerie/package-lock.json

      # Build VISITEUR : GALERIE_EDITOR n'est pas armé, donc l'éditeur n'est
      # pas seulement désactivé — il n'est pas émis. Voir vite.config.js.
      - name: Build de la galerie (Vite, mode Visiteur)
        working-directory: galerie
        run: |
          npm ci
          npm run build

      # Garde-fou : on inspecte le RÉSULTAT, pas la configuration. Une erreur
      # de config est précisément ce qu'on cherche à attraper, et un chunk
      # d'éditeur publié reste téléchargeable par simple URL même sur un
      # dépôt privé. Rouge ici vaut mieux que vert avec l'outil d'auteur en
      # ligne.
      - name: Contrôle — aucun code d'éditeur dans ce qui sera publié
        working-directory: galerie
        run: npm run check

      # `cp -r src dest` copie DANS dest quand dest existe déjà (on obtiendrait
      # _site/galerie/dist/). On supprime donc la cible d'abord, puis on vérifie
      # que la page d'entrée est bien à /galerie/index.html — mieux vaut un
      # workflow rouge qu'un déploiement vert servant un 404.
      - name: Assemblage (galerie sous /galerie/)
        run: |
          sudo rm -rf _site/galerie
          sudo cp -r galerie/dist _site/galerie
          echo "--- contenu de _site (2 niveaux) ---"
          find _site -maxdepth 2 -not -path '*/.*' | sort | head -40
          echo "--- contrôle ---"
          test -f _site/galerie/index.html \
            || { echo "::error::_site/galerie/index.html manquant"; exit 1; }
          test -d _site/galerie/works \
            || echo "::warning::_site/galerie/works absent (configs d'œuvres)"
          echo "OK : /galerie/ servira $(du -sh _site/galerie | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
