# Déploiement GitHub Pages : blog Jekyll (racine) + galerie 3D (/galerie/).
#
# Se déclenche à chaque push sur master (et sur la branche de développement de
# la galerie), ou manuellement depuis l'onglet Actions (« Run workflow »).
#
# Prérequis (une seule fois) : Settings → Pages → Source = « GitHub Actions ».
# L'étape configure-pages tente de l'activer automatiquement.
name: Deploy Pages (blog + galerie)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tant que la source Pages reste « Deploy from a branch », GitHub lance
      # en parallèle son propre build Jekyll (« pages build and deployment »)
      # qui ne contient PAS la galerie (exclue dans _config.yml) et qui écrase
      # notre déploiement — d'où un 404 sur /galerie/ alors que le blog passe.
      # On bascule donc la source sur « GitHub Actions », ce qui désactive ce
      # build concurrent.
      - name: Source Pages = GitHub Actions
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}') || true
          echo "PUT /pages build_type=workflow -> HTTP $code"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            cat /tmp/pages.json || true
            echo "::warning::Bascule automatique impossible. Réglez Settings → Pages → Source sur « GitHub Actions »."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build du blog Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: galerie/package-lock.json

      - name: Build de la galerie (Vite)
        working-directory: galerie
        run: |
          npm ci
          npm run build

      # `cp -r src dest` copie DANS dest quand dest existe déjà (on obtiendrait
      # _site/galerie/dist/). On supprime donc la cible d'abord, puis on vérifie
      # que la page d'entrée est bien à /galerie/index.html — mieux vaut un
      # workflow rouge qu'un déploiement vert servant un 404.
      - name: Assemblage (galerie sous /galerie/)
        run: |
          sudo rm -rf _site/galerie
          sudo cp -r galerie/dist _site/galerie
          echo "--- contenu de _site (2 niveaux) ---"
          find _site -maxdepth 2 -not -path '*/.*' | sort | head -40
          echo "--- contrôle ---"
          test -f _site/galerie/index.html \
            || { echo "::error::_site/galerie/index.html manquant"; exit 1; }
          test -d _site/galerie/works \
            || echo "::warning::_site/galerie/works absent (configs d'œuvres)"
          echo "OK : /galerie/ servira $(du -sh _site/galerie | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
